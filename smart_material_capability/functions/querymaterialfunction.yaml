action_groups:
  - actions:
      - type: agent-request
        system_alias: SMART_MATERIAL_QUERY
        agent_type: remote
        result_variable: agentResult
      # agentResult.body is already the unwrapped Task (no extra .result
      # envelope layer). Root cause of every prior failure: the agent used to
      # enqueue a submitted Task then a separate completed status update -
      # Joule's agent-request captured the submitted event (status={state:
      # submitted}, no message at all) before the completed update applied,
      # confirmed by rendering the raw .status structure via this same
      # set-variables step. The agent now enqueues a single already-completed
      # Task, so status.message is always present here.
      - type: set-variables
        variables:
          - name: replyText
            value: <? agentResult.body.status.message.parts[0].text ?>
      - type: message
        message:
          type: text
          content: "<? replyText ?>"
      # query_agent.py's _add_report_prompts() pre-computes the exact 3
      # button prompts (report_prompt_csv/excel/pdf) as plain strings on
      # the Python side - confirmed live that this Joule SpEL engine cannot
      # reliably evaluate nested branching logic (every attempt at deriving
      # report type/identifier here via ternaries either silently returned
      # null or crashed the rest of the action group), but plain single-
      # level property access has always worked. So this only ever does a
      # trivial property lookup, no conditional logic of its own.
      - type: message
        message:
          type: buttons
          content:
            title: Want a downloadable report of this?
            buttons:
              - type: postback
                title: CSV
                value: "<? agentResult.body.status.message.parts.size() > 1 ? agentResult.body.status.message.parts[1].data.tool_results[0].report_prompt_csv : 'Generate a report in CSV format' ?>"
              - type: postback
                title: Excel
                value: "<? agentResult.body.status.message.parts.size() > 1 ? agentResult.body.status.message.parts[1].data.tool_results[0].report_prompt_excel : 'Generate a report in Excel format' ?>"
              - type: postback
                title: PDF
                value: "<? agentResult.body.status.message.parts.size() > 1 ? agentResult.body.status.message.parts[1].data.tool_results[0].report_prompt_pdf : 'Generate a report in PDF format' ?>"