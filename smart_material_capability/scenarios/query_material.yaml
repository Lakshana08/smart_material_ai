description: >-
  Looks up material master data, stock levels, and production order status
  in S/4HANA. Use when the user asks about the stock for a material, wants
  material master details for a product, wants to check the status of a
  production order, or wants to know how many total material masters,
  stock records, production orders, or serial numbers exist in the system
  (with no specific material/product/order given). This is NOT about
  inventory aging or aged/stale materials, non-controlled or over-control/
  over-issued status, or machine-head material review candidates - those
  are handled by a separate material status check. Example phrasings:
  "what's the stock for material MAT-1000?", "look up material master data
  for product MAT-2000", "show me production order 60001234", "how many
  production orders are there in total?", "how many product masters exist?".
target:
  name: querymaterialfunction
  type: function