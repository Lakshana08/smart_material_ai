applications:
  - name: smart-material-ai
    memory: 256M
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    env:
      S4_DESTINATION_NAME: S4HANA_MATERIAL_API
    services:
      - smart-material-ai-destination
      - smart-material-ai-connectivity
